{% extends 'base.html' %}
{% block title %}Login - Elevate WS{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="text-center mb-4">
          <i class="bi bi-lightning-charge-fill display-5 text-warning"></i>
          <h3 class="fw-black mt-2">Welcome Back</h3>
          <p class="text-muted small">Sign in to your account</p>
        </div>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">
          Don't have an account? <a href="{% url 'accounts:register_choice' %}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
