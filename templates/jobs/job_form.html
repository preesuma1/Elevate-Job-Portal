{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ action }} - Elevate WS{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-5">
          <h3 class="fw-black mb-1">{{ action }}</h3>
          <p class="text-muted mb-4">Fill in the details to {{ action|lower }}</p>
          <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-3 mt-4">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check2-circle me-2"></i>{{ action }}
              </button>
              <a href="{% url 'dashboard:company_dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
