{% extends 'base.html' %}
{% block title %}Delete Job - Elevate WS{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 text-center p-5">
        <i class="bi bi-trash3 display-3 text-danger mb-3"></i>
        <h4 class="fw-bold">Delete this Job?</h4>
        <p class="text-muted">You're about to delete <strong>"{{ job.title }}"</strong>. This action cannot be undone.</p>
        <form method="POST" class="d-flex justify-content-center gap-3 mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
          <a href="{% url 'dashboard:company_dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
